spring:
  profiles: 
    active: prod
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://postgres-service:5432/appdb
    username: appuser
    password: pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

