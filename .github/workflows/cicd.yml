name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (backend)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Build backend
      - name: Build Spring Boot
        run: |
          cd backend
          mvn clean package

      # 4. Setup Node (frontend)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 5. Build Angular
      - name: Build Angular
        run: |
          cd frontend
          npm install
          npm run build